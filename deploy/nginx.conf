map $http_upgrade $wotp_connection_upgrade {
    default upgrade;
    '' close;
}
map $http_cf_connecting_ip $wotp_client_ip {
    default $http_cf_connecting_ip;
    '' $remote_addr;
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $wotp_client_ip;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $wotp_connection_upgrade;
    proxy_read_timeout 300s;
    location = /gateway { return 308 /gateway/; }
    location /gateway/ {
        proxy_pass http://api:8000/;
        proxy_buffering off;
    }
    location = /pb { return 308 /pb/; }
    location /pb/ {
        proxy_pass http://pocketbase:8090/;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://web:3000;
    }
}
