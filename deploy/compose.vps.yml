name: wotp
services:
  pocketbase:
    build:
      context: ../backend/pocketbase
    restart: unless-stopped
    environment:
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:?}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:?}
    volumes:
      - ../data/pocketbase:/pb/pb_data
      - ../backend/pocketbase/pb_migrations:/pb/pb_migrations:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8090/api/health']
      interval: 10s
      timeout: 5s
      retries: 6
  api:
    build:
      context: ../backend
    env_file: ../.env
    environment:
      PB_URL: http://pocketbase:8090
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --workers, '1', --root-path, /gateway]
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, 'http://127.0.0.1:8000/health']
      interval: 10s
      timeout: 5s
      retries: 6
  web:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_PB_URL: ${NEXT_PUBLIC_PB_URL:?}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?}
        NEXT_PUBLIC_PB_COLLECTIONS_PREFIX: waotp_
        NEXT_PUBLIC_SENTRY_DISABLED: 'true'
        NEXT_PUBLIC_GITHUB_REPO: Luckyyaduvanshiofficial/wotp
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
  gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:8113:8080'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
      - pocketbase
    networks:
      default:
      clients:
        aliases: [wotp-gateway]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/gateway/health']
      interval: 15s
      timeout: 5s
      retries: 4
networks:
  clients:
    name: wotp_clients
